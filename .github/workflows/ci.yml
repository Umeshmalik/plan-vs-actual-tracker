# Gate: nothing deploys unless `npm run check` passes
# (typecheck + lint + format + tests — the same one command you run locally).
name: ci
on: { push: { branches: [main] }, pull_request: {} }

permissions: { contents: read }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm } # one Node version, .nvmrc owns it
      - run: npm ci
      - run: npm run check

  # Deploy runs only when the three Vercel secrets are set. Connecting the repo
  # in the Vercel dashboard instead gives you the same deploys with no secrets
  # at all — but then Vercel builds on push without waiting for `verify`, and a
  # red build could still ship. This job is the version where tests gate the
  # deploy, which is the point of having CI.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
